name: github-copilot
kind: model-provider
version: 1.1.0
description: >
  GitHub Copilot as a Hermes model provider, formerly bundled in hermes-agent core. Two
  providers: copilot (the Copilot API with your GitHub account, signed in with
  `hermes auth add copilot` or a COPILOT_GITHUB_TOKEN / GH_TOKEN / GITHUB_TOKEN token) and
  copilot-acp (drives your installed GitHub Copilot CLI over ACP). Needs a Hermes core
  without bundled Copilot; on older cores it stays inactive.
author: "Nous Research"
homepage: https://github.com/NousResearch/hermes-labs-plugins/tree/main/github-copilot
