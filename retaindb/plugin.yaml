name: retaindb
label: RetainDB
version: 2.0.0
requires_hermes: ">=0.22.0"  # oldest tested release: spawn_context_thread, strip_launch_profile_env
description: >
  RetainDB memory provider for Hermes Agent (Hermes Labs plugin: built by Nous Research,
  not supported): a cloud memory API with hybrid search (vector + BM25 + reranking) over
  seven memory types, a stable user profile, remember/forget tools and a shared file store.
  Needs a RetainDB account (RETAINDB_API_KEY). Formerly built into Hermes core.
author: NousResearch
homepage: https://github.com/NousResearch/hermes-labs-plugins/tree/main/retaindb
requires_env:
  - RETAINDB_API_KEY
config_keys:
  - memory.retaindb  # base_url / project persisted by the dashboard
